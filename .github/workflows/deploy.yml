name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily at 07:00 Taiwan time: refresh the macro data (public/data/macro.json).
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Public macro data (FRED, 國發會, 主計總處, 證交所, 富邦) needs no API key
      # but blocks browsers, so it is fetched here and served with the site.
      # A failed fetch must not block the deploy; the page then says so.
      - name: Fetch macro data
        run: npx tsx scripts/macro-data.mts
        continue-on-error: true
      # Listed stocks and ETFs for the screener (TWSE open data, no key).
      - name: Fetch stock data
        run: npx tsx scripts/stocks-data.mts
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
