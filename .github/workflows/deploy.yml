name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily at 07:00 Taiwan time (after the US close) and weekdays at 14:30
  # (after the Taiwan close): refresh the index, macro, stock and fund data.
  # Daily at 06:00: the automatic research (handbook 06 §1.1).
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      research:
        description: 執行每日自動研究（當天已研究過也重做）
        type: boolean
        default: false
      auto:
        description: 看門狗補跑（每日研究照常判斷是否該做）
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# The 06:00 research runs about 20 minutes; a push meanwhile waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Start from the data the live site serves now: a source that fails
      # below then keeps yesterday's file instead of leaving the page empty.
      - name: Restore last published data
        run: |
          mkdir -p public/data
          for f in macro stocks stock-closes funds indices events valuation daily-research active-etf health; do
            curl -sf -o "public/data/$f.json" "https://aceehsu7396.github.io/personal-wealth-management/data/$f.json" \
              || rm -f "public/data/$f.json"
          done
        continue-on-error: true
      # Public macro data (FRED, 國發會, 主計總處, 證交所, 富邦) needs no API key
      # but blocks browsers, so it is fetched here and served with the site.
      # A failed fetch must not block the deploy; the page then says so.
      - name: Fetch macro data
        run: npx tsx scripts/macro-data.mts
        continue-on-error: true
      # Taiwan and US benchmark indexes (FinMind, checked against 證交所,
      # 櫃買中心, FRED and Yahoo; no key).
      - name: Fetch index data
        run: npx tsx scripts/index-data.mts
        continue-on-error: true
      # Listed stocks and ETFs for the screener (TWSE open data, no key).
      - name: Fetch stock data
        run: npx tsx scripts/stocks-data.mts
        continue-on-error: true
      # The three largest active ETFs' daily holdings (open-source project
      # active-etf), checked against 統一 and 復華's own sites (no key).
      - name: Fetch active ETF holdings
        run: npx tsx scripts/active-etf.mts
        continue-on-error: true
      # The market-wide part of the daily push notification.
      - name: Build push brief
        run: npx tsx scripts/brief-data.mts
        continue-on-error: true
      # TWSE-wide P/E, one point per day on top of the published history.
      - name: Update valuation history
        run: npx tsx scripts/valuation-data.mts
        continue-on-error: true
      # Ex-dividend dates and investor conferences (TWSE and TPEx open data,
      # no key); conference notices accumulate on top of the published file.
      - name: Fetch event calendar
        run: npx tsx scripts/events-data.mts
        continue-on-error: true
      # Latest NAV of every fund sold in Taiwan (Anue fund list, no key).
      - name: Fetch fund NAVs
        run: npx tsx scripts/fund-nav.mts
        continue-on-error: true
      # One stock from each of seven screens: health check, then every
      # library template backtested for those rated 留意 or better.
      # GitHub often starts schedules hours late and may drop one, so every
      # scheduled run tries; the first one on a Taiwan date does the day's
      # research and the rest skip it.
      - name: Daily automatic research
        if: github.event_name == 'schedule' || inputs.research || inputs.auto
        run: npx tsx scripts/daily-research.mts
        env:
          FORCE_RESEARCH: ${{ inputs.research && '1' || '' }}
        continue-on-error: true
      # Is every file as new as it should be? Anything late has its script
      # run once more here; the watchdog workflow keeps retrying and only
      # then notifies (handbook 附錄 C §7).
      - name: Check data freshness
        run: npx tsx scripts/data-health.mts
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
