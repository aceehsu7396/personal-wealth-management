name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily at 07:00 Taiwan time (after the US close) and weekdays at 14:30
  # (after the Taiwan close): refresh the index, macro, stock and fund data.
  schedule:
    - cron: '0 23 * * *'
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Start from the data the live site serves now: a source that fails
      # below then keeps yesterday's file instead of leaving the page empty.
      - name: Restore last published data
        run: |
          mkdir -p public/data
          for f in macro stocks funds indices; do
            curl -sf -o "public/data/$f.json" "https://aceehsu7396.github.io/personal-wealth-management/data/$f.json" \
              || rm -f "public/data/$f.json"
          done
        continue-on-error: true
      # Public macro data (FRED, 國發會, 主計總處, 證交所, 富邦) needs no API key
      # but blocks browsers, so it is fetched here and served with the site.
      # A failed fetch must not block the deploy; the page then says so.
      - name: Fetch macro data
        run: npx tsx scripts/macro-data.mts
        continue-on-error: true
      # Taiwan and US benchmark indexes (FinMind, checked against 證交所,
      # 櫃買中心, FRED and Yahoo; no key).
      - name: Fetch index data
        run: npx tsx scripts/index-data.mts
        continue-on-error: true
      # Listed stocks and ETFs for the screener (TWSE open data, no key).
      - name: Fetch stock data
        run: npx tsx scripts/stocks-data.mts
        continue-on-error: true
      # Latest NAV of every fund sold in Taiwan (Anue fund list, no key).
      - name: Fetch fund NAVs
        run: npx tsx scripts/fund-nav.mts
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
